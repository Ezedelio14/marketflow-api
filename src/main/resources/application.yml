spring:
  application:
    name: marketflow-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/marketflow}
    username: ${DB_USERNAME:marketflow}
    password: ${DB_PASSWORD:marketflow}
    hikari:
      maximum-pool-size: 20
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 5000
    consumer:
      group-id: marketflow-api
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.marketflow.api.application.event
  mvc:
    problemdetails:
      enabled: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    persist-authorization: true
    display-request-duration: true
  default-produces-media-type: application/json

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{correlationId:-}]"

marketflow:
  currency: ${MARKETFLOW_CURRENCY:BRL}
  security:
    jwt:
      # Base64-encoded HMAC key (>= 256 bits). Override in every non-local environment.
      secret: ${JWT_SECRET:bWFya2V0Zmxvdy1sb2NhbC1kZXYtc2VjcmV0LWtleS1jaGFuZ2UtbWUtcGxlYXNlLTEyMzQ1Njc4OTA=}
      issuer: marketflow-api
      access-token-ttl: 60m
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:sk_test_replace_me}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_replace_me}
  checkout:
    reservation-ttl: 15m
    optimistic-attempts: 2
    max-attempts: 3
    expiration-job-delay: PT60S
  tax:
    rate: 0.00
  shipping:
    standard-base: 15.00
    standard-per-kg: 2.50
    express-base: 29.90
    express-per-kg: 4.00
    free-shipping-threshold: 299.00
  rate-limit:
    enabled: true
    default-per-minute: 120
    auth-per-minute: 10
    checkout-per-minute: 20
  idempotency:
    ttl: 24h
    lock-ttl: 30s
  bootstrap:
    admin-email: ${ADMIN_EMAIL:admin@marketflow.dev}
    admin-password: ${ADMIN_PASSWORD:Admin@123456}
